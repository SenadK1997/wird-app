<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Wird: shared dhikr</title>
    <meta name="description" content="Someone shared a dhikr with you. Open it in Wird, the dhikr and tasbih counter." />
    <link rel="icon" href="icon.png" />
    <link rel="stylesheet" href="site.css" />
    <style>
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin: 24px 0; text-align: center; }
      .arabic { font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif; font-size: 30px; line-height: 1.9; direction: rtl; margin: 0 0 12px; }
      .name { font-weight: 600; margin: 0 0 4px; }
      .steps { text-align: left; margin: 12px 0 0; padding: 0; list-style: none; }
      .steps li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); }
      .steps li:last-child { border-bottom: 0; }
      .button { display: block; text-align: center; background: var(--accent); color: #0e2621; font-weight: 600; text-decoration: none; padding: 14px; border-radius: 14px; margin: 12px 0; }
      .button:hover { color: #0e2621; background: #e3c484; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="./"><img src="icon.png" alt="" width="44" height="44" />Wird</a>

      <h1 id="heading">Someone shared a dhikr with you</h1>
      <div id="card" class="card hidden"></div>
      <p id="invalid" class="muted hidden">This link is incomplete. Ask for the link again.</p>

      <a id="open" class="button" href="#">Open in Wird</a>
      <p id="hint" class="muted">Don't have Wird yet? Install it, then tap this link again.</p>
      <div class="stores">
        <a href="https://apps.apple.com/app/id6819874614">App Store</a>
        <a href="https://play.google.com/store/apps/details?id=com.kenyro.wird">Google Play</a>
      </div>

      <footer>Wird · Daily dhikr &amp; tasbih · <a href="privacy.html">Privacy</a></footer>
    </main>

    <script>
      // Reads the share code after "#" (see src/utils/share-link.ts in the app) and shows it.
      (function () {
        var TEXT = {
          en: { dhikr: 'Someone shared a dhikr with you', flow: 'Someone shared a flow with you', open: 'Open in Wird', hint: "Don't have Wird yet? Install it, then tap this link again.", invalid: 'This link is incomplete. Ask for the link again.' },
          bs: { dhikr: 'Neko ti je poslao zikr', flow: 'Neko ti je poslao niz zikrova', open: 'Otvori u Wird aplikaciji', hint: 'Nemaš Wird? Instaliraj ga, pa ponovo dodirni ovaj link.', invalid: 'Ovaj link nije potpun. Zatraži ga ponovo.' },
          tr: { dhikr: 'Biri seninle bir zikir paylaştı', flow: 'Biri seninle bir zikir akışı paylaştı', open: "Wird'de aç", hint: "Wird yüklü değil mi? Yükle, sonra bu bağlantıya tekrar dokun.", invalid: 'Bu bağlantı eksik. Bağlantıyı tekrar iste.' },
          de: { dhikr: 'Jemand hat ein Dhikr mit dir geteilt', flow: 'Jemand hat einen Ablauf mit dir geteilt', open: 'In Wird öffnen', hint: 'Noch kein Wird? Installiere es und tippe dann erneut auf diesen Link.', invalid: 'Dieser Link ist unvollständig. Bitte um einen neuen Link.' },
          ar: { dhikr: 'شارك أحدهم معك ذكرًا', flow: 'شارك أحدهم معك سلسلة أذكار', open: 'افتح في تطبيق ورد', hint: 'ليس لديك تطبيق ورد؟ ثبّته ثم اضغط على هذا الرابط مرة أخرى.', invalid: 'هذا الرابط غير مكتمل. اطلب الرابط مرة أخرى.' },
        };
        var lang = (navigator.language || 'en').slice(0, 2);
        if (lang === 'hr' || lang === 'sr') lang = 'bs';
        var tx = TEXT[lang] || TEXT.en;
        if (lang === 'ar') document.documentElement.dir = 'rtl';

        // Names of the built-in dhikr, by their share code's position (src/data/share-codes.ts).
        // Append-only, like the list in the app.
        var TITLES = ["SubhanAllah","Alhamdulillah","Allahu Akbar","La ilaha illallah","Astaghfirullah","Allahumma salli 'ala Muhammad","SubhanAllahi wa bihamdihi","La hawla wa la quwwata illa billah","Ayat al-Kursi","Surah Al-Ikhlas","Surah Al-Falaq","Surah An-Nas","Allahumma bika asbahna","Allahumma bika amsayna","Radina billahi Rabba","Bismillahil-ladhi la yadurru","A'udhu bi kalimatillahit-tammat","Hasbiyallahu la ilaha illa Huwa","Allahumma inni as'aluka 'ilman nafi'an","Allahummak-fini bi halalika 'an haramik","Rabbi inni lima anzalta ilayya min khayrin faqir","Astaghfirullaha wa atubu ilayh","Rabbighfir li wa tub 'alayya","Sayyid al-Istighfar","La ilaha illa Anta, subhanaka","Hasbunallahu wa ni'mal wakil","Ya Hayyu ya Qayyum, bi rahmatika astaghith","Bismika Allahumma amutu wa ahya","Bismika Rabbi wada'tu janbi","Allahumma qini 'adhabak","Alhamdu lillahil-ladhi ahyana","Bismillah, tawakkaltu 'alallah","Bismillahi walajna","Allahummaftah li abwaba rahmatik","Allahumma inni as'aluka min fadlik","Bismillah","Bismillahi awwalahu wa akhirahu","Alhamdu lillahil-ladhi at'amani","Subhanal-ladhi sakhkhara lana hadha","Allahumma inna nas'aluka fi safarina","Ayibuna, ta'ibuna, 'abiduna","Ar-Rahman","Ar-Rahim","Al-Malik","Al-Quddus","As-Salam","Al-Mu'min","Al-Muhaymin","Al-'Aziz","Al-Jabbar","Al-Mutakabbir","Al-Khaliq","Al-Bari'","Al-Musawwir","Al-Ghaffar","Al-Qahhar","Al-Wahhab","Ar-Razzaq","Al-Fattah","Al-'Alim","Al-Qabid","Al-Basit","Al-Khafid","Ar-Rafi'","Al-Mu'izz","Al-Mudhill","As-Sami'","Al-Basir","Al-Hakam","Al-'Adl","Al-Latif","Al-Khabir","Al-Halim","Al-'Azim","Al-Ghafur","Ash-Shakur","Al-'Aliyy","Al-Kabir","Al-Hafiz","Al-Muqit","Al-Hasib","Al-Jalil","Al-Karim","Ar-Raqib","Al-Mujib","Al-Wasi'","Al-Hakim","Al-Wadud","Al-Majid","Al-Ba'ith","Ash-Shahid","Al-Haqq","Al-Wakil","Al-Qawiyy","Al-Matin","Al-Waliyy","Al-Hamid","Al-Muhsi","Al-Mubdi'","Al-Mu'id","Al-Muhyi","Al-Mumit","Al-Hayy","Al-Qayyum","Al-Wajid","Al-Majid","Al-Wahid","Al-Ahad","As-Samad","Al-Qadir","Al-Muqtadir","Al-Muqaddim","Al-Mu'akhkhir","Al-Awwal","Al-Akhir","Az-Zahir","Al-Batin","Al-Wali","Al-Muta'ali","Al-Barr","At-Tawwab","Al-Muntaqim","Al-'Afuww","Ar-Ra'uf","Malik al-Mulk","Dhul-Jalali wal-Ikram","Al-Muqsit","Al-Jami'","Al-Ghaniyy","Al-Mughni","Al-Mani'","Ad-Darr","An-Nafi'","An-Nur","Al-Hadi","Al-Badi'","Al-Baqi","Al-Warith","Ar-Rashid","As-Sabur"];

        var code = (location.hash || '').slice(1);
        var SEP = '';

        function b64bytes(text) {
          var b64 = text.replace(/-/g, '+').replace(/_/g, '/');
          while (b64.length % 4) b64 += '=';
          var bin = atob(b64);
          var bytes = [];
          for (var i = 0; i < bin.length; i++) bytes.push(bin.charCodeAt(i));
          return bytes;
        }

        // Version 2: ASCII as is, 0x80-0xFE = Arabic U+0600-U+067E, 0xFF = one UTF-8 character follows.
        function unpack(bytes) {
          var out = '';
          for (var i = 0; i < bytes.length; ) {
            var b = bytes[i++];
            if (b < 0x80) out += String.fromCharCode(b);
            else if (b < 0xff) out += String.fromCharCode(0x0600 + b - 0x80);
            else {
              var lead = bytes[i];
              var size = lead >= 0xf0 ? 4 : lead >= 0xe0 ? 3 : 2;
              out += new TextDecoder().decode(new Uint8Array(bytes.slice(i, i + size)));
              i += size;
            }
          }
          return out;
        }

        // Both versions become { dhikr: {t, tr, ar, n} } or { flow: { t, steps: [{ name, n }] } }.
        function read(code) {
          if (code.charAt(0) === '2') {
            var f = unpack(b64bytes(code.slice(1))).split(SEP);
            if (f[0] === 'd') return { dhikr: { t: f[1], tr: f[2], ar: f[3], n: Number(f[4]) } };
            if (f[0] !== 'f') return null;
            var steps = [];
            for (var i = 2; i < f.length; ) {
              if (f[i].charAt(0) === 'b') {
                var parts = f[i].slice(1).split(':');
                steps.push({ name: TITLES[parseInt(parts[0], 36)] || '?', n: Number(parts[1]) });
                i += 1;
              } else if (f[i] === 'c') {
                steps.push({ name: f[i + 1], n: Number(f[i + 5]) });
                i += 6;
              } else return null;
            }
            return { flow: { t: f[1], steps: steps } };
          }
          var json = JSON.parse(new TextDecoder().decode(new Uint8Array(b64bytes(code))));
          if (json.v !== 1) return null;
          if (json.d) return { dhikr: json.d };
          if (json.f) {
            return {
              flow: {
                t: json.f.t,
                steps: (json.f.s || []).map(function (s) {
                  return { name: s.c ? s.c.t : s.t || String(s.b).replace(/-/g, ' '), n: s.n };
                }),
              },
            };
          }
          return null;
        }

        var data = null;
        try {
          data = read(code);
        } catch (e) {
          data = null;
        }

        var heading = document.getElementById('heading');
        var card = document.getElementById('card');
        var open = document.getElementById('open');
        document.getElementById('hint').textContent = tx.hint;
        open.textContent = tx.open;

        function el(tag, cls, text) {
          var node = document.createElement(tag);
          if (cls) node.className = cls;
          if (text) node.textContent = text;
          return node;
        }

        if (!data) {
          heading.textContent = tx.dhikr;
          var invalid = document.getElementById('invalid');
          invalid.textContent = tx.invalid;
          invalid.classList.remove('hidden');
          open.classList.add('hidden');
          return;
        }

        if (data.dhikr) {
          heading.textContent = tx.dhikr;
          if (data.dhikr.ar) card.appendChild(el('p', 'arabic', data.dhikr.ar));
          card.appendChild(el('p', 'name', data.dhikr.t));
          if (data.dhikr.tr) card.appendChild(el('p', 'muted', data.dhikr.tr));
          card.appendChild(el('p', 'muted', data.dhikr.n ? data.dhikr.n + '×' : '∞'));
        } else {
          heading.textContent = tx.flow;
          card.appendChild(el('p', 'name', data.flow.t));
          var list = el('ul', 'steps');
          data.flow.steps.forEach(function (step, index) {
            var li = el('li');
            li.appendChild(el('span', '', index + 1 + '. ' + step.name));
            li.appendChild(el('span', 'muted', step.n + '×'));
            list.appendChild(li);
          });
          card.appendChild(list);
        }
        card.classList.remove('hidden');

        // Android opens the app through an intent, falling back to the Play Store if it is missing.
        // Other phones use the app's own link; the store buttons are there if it is not installed.
        var appLink = 'wird://add?d=' + code;
        var android = /android/i.test(navigator.userAgent);
        open.href = android
          ? 'intent://add?d=' + code + '#Intent;scheme=wird;package=com.kenyro.wird;S.browser_fallback_url=' +
            encodeURIComponent('https://play.google.com/store/apps/details?id=com.kenyro.wird') + ';end'
          : appLink;
      })();
    </script>
  </body>
</html>
